<template>
    <div class="wrapper">
        <!-- Error Message -->
        <template if:true={hasError}>
            <div class="error-container">
                <div class="error-message">
                    <lightning-icon icon-name="utility:error" size="small" class="error-icon"></lightning-icon>
                    <span>{errorMessage}</span>
                </div>
            </div>
        </template>

        <!-- Messages Container -->
        <div class="messages-container">
            <template if:false={hasMessages}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:chat" size="large" class="empty-icon"></lightning-icon>
                    <p>Nog geen berichten. Start een gesprek!</p>
                </div>
            </template>

            <template for:each={messages} for:item="message">
                <div key={message.id} class={message.cssClass}>
                    <div class="message-bubble">
                        <template if:true={message.isSystem}>
                            <div class="system-message">
                                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                <span>{message.text}</span>
                            </div>
                        </template>
                        <template if:false={message.isSystem}>
                            <div class="message-content">
                                <lightning-formatted-rich-text value={message.text}></lightning-formatted-rich-text>
                            </div>
                            <div class="message-time">{message.timestamp}</div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Typing Indicator -->
            <template if:true={isTyping}>
                <div class="message assistant">
                    <div class="message-bubble">
                        <div class="typing-indicator">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Input Area - Custom Footer -->
        <div class="input-container">
            <lightning-textarea
                value={inputMessage}
                placeholder="Typ uw vraag hier..."
                onchange={handleInputChange}
                onkeypress={handleKeyPress}
                disabled={isLoading}
                class="message-input"
                max-length="2000"
                variant="label-hidden"
            ></lightning-textarea>
            <div class="button-group">
                <lightning-button
                    variant="brand"
                    title="Verzend bericht"
                    onclick={handleSend}
                    disabled={sendButtonDisabled}
                    icon-name="utility:send"
                    class="compact-button"
                ></lightning-button>
                <lightning-button
                    variant="neutral"
                    title="Reset gesprek"
                    onclick={handleReset}
                    disabled={isLoading}
                    icon-name="utility:refresh"
                    class="compact-button"
                ></lightning-button>
            </div>
        </div>
    </div>
</template>
