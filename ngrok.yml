version: 2
authtoken: YOUR_NGROK_AUTH_TOKEN

tunnels:
  #ft. Sjat GEeepietie
  # === MCP SERVER ===
  # Draait bij jou op localhost:8000
  # Dit is de tunnel die de ZAS agent gebruikt voor zijn hosted MCP tools
  mcp:
    addr: 8000
    proto: http
    
    # optioneel: vaste subdomain (betaald account nodig)
    # subdomain: zas-mcp

  # === ZAS CHAT API ===
  # Draait bij jou op localhost:9000
  # Dit is de tunnel waar je Chrome-extensie op praat
  zas_chat:
    addr: 9000
    proto: http
    
    # optioneel: vaste subdomain (betaald account nodig)
    # subdomain: zas-chat
