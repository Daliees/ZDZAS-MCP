<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Tigris ZAS Chat – Instellingen</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      margin: 0;
      padding: 16px;
      background: #050b12;
      color: #e5f3ff;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(106, 160, 200, 0.5);
      background: #02070f;
      color: #e5f3ff;
      font-size: 13px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #00cec9;
      box-shadow: 0 0 0 1px rgba(0, 206, 201, 0.35);
    }
    button {
      margin-top: 10px;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: #021216;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.8;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>Tigris ZAS Chat – Instellingen</h1>

  <label for="api-url">ZAS Chat API URL</label>
  <input
    type="text"
    id="api-url"
    placeholder="bijv. http://192.168.104.14:9000 (of .../chat)"
  />

  <button id="save">Opslaan</button>
  <div id="status"></div>

  <div class="hint">
    Zorg dat je <code>chat_api.py</code> draait en CORS correct is
    geconfigureerd voor deze URL.
  </div>

  <script src="options.js"></script>
</body>
</html>
